; Solo para el contenedor de desarrollo (código montado por bind-mount desde
; Windows). Por defecto, opcache revalida el timestamp de cada archivo PHP
; (incluido vendor/) contra el disco cada 2 segundos; en un bind-mount de
; Windows cada uno de esos stat() cruza el puente lento host<->contenedor, lo
; que en este proyecto se traducía en ~5-8s por request. Subir el intervalo
; no afecta el comportamiento de la app: los cambios de código simplemente
; tardan hasta este intervalo en reflejarse (o se ven al instante si el
; contenedor se reinicia).
opcache.revalidate_freq=60
