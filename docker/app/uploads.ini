; La app permite hasta 10 MB por archivo (config('archivo.max_mb'), 05B) y una
; postulación (D2) puede enviar la DJ + varios sustentos en la misma petición
; multipart. Los valores por defecto de la imagen php:8.3-fpm (2M/8M) quedan
; muy por debajo de eso: PHP descarta el archivo en silencio antes de que
; Laravel valide, y la 422 resultante ("no se pudo subir") es indistinguible
; de un archivo realmente corrupto — de ahí el bug intermitente reportado.
upload_max_filesize = 12M
post_max_size = 60M
max_file_uploads = 20
memory_limit = 256M
