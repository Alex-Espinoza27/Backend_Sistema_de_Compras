server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Debe ir a la par de upload_max_filesize/post_max_size del contenedor app
    # (docker/app/uploads.ini): una postulación puede enviar la DJ + varios
    # sustentos de hasta 10 MB cada uno en la misma petición.
    client_max_body_size 60m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
